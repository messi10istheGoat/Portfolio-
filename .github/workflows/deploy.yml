name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Refresh live GitHub-activity data nightly (main branch only).
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages-enabled: ${{ steps.pages-state.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check whether Pages is enabled
        id: pages-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::Enable it once under Settings > Pages > Source: GitHub Actions, then re-run this workflow. The static build below still runs so the export stays verified."
          fi

      - name: Configure Pages
        id: pages
        # Requires an existing Pages site; skipped until an admin enables it.
        if: steps.pages-state.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Compute public URL
        id: site
        env:
          # A repository variable overrides everything; otherwise derive the
          # Pages origin from the repo so the build is correct before Pages
          # has ever been enabled.
          CONFIGURED_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$CONFIGURED_URL" ]; then
            echo "url=$CONFIGURED_URL" >> "$GITHUB_OUTPUT"
          elif [ -n "$PAGES_ORIGIN" ]; then
            echo "url=$PAGES_ORIGIN" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://${OWNER,,}.github.io" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$PAGES_BASE" ]; then
            echo "base=$PAGES_BASE" >> "$GITHUB_OUTPUT"
          elif [[ "${REPO,,}" == "${OWNER,,}.github.io" ]]; then
            echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${REPO}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          # "" for user sites and "/repo" for project sites; fed straight into
          # the Next.js basePath.
          NEXT_BASE_PATH: ${{ steps.site.outputs.base }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.url }}
          # Optional: real contribution graph when a token exists.
          GITHUB_TOKEN: ${{ secrets.GH_ACTIVITY_TOKEN }}
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME }}
        run: npm run build:static

      - name: Verify export
        run: |
          test -f out/index.html
          test -f out/resume.pdf
          test -f out/404.html
          test -f out/feed.xml
          echo "Export OK — $(find out -type f | wc -l) files, $(du -sh out | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publish
    needs: build
    # Skip cleanly (instead of failing) until Pages has been switched on once.
    if: needs.build.outputs.pages-enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
